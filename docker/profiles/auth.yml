# ============================================
# INFORMATIONS DU SERVICE
# ============================================
name: auth
description: "Service d'authentification"
enabled: true
always_active: true  # Si true, démarré automatiquement sans --profile
docker_profile: null  # Nom du profil Docker (ou null si always_active)
keep_port_mapping: true

# ============================================
# CONFIGURATION DOCKER
# ============================================
docker-compose:

  image: quay.io/keycloak/keycloak:${KC_VERSION:-26.6.0}

  container_name: auth
  volumes:
    - ./keycloak/data:/var/tmp/configs:ro
    - ./keycloak/startup-scripts/init.sh:/init.sh
    - ./keycloak/keycloak.conf:/opt/keycloak/conf/keycloak.conf
    - ./keycloak/customized:/opt/keycloak/themes/customized
  entrypoint: sh -c "/init.sh"
  ports:
    - "${KC_PORT:-8180}:${KC_PORT:-8180}"
  environment:
    - IMPORT_VARSUBSTITUTION_ENABLED=${IMPORT_VARSUBSTITUTION_ENABLED:-false}
    # --- Admin ---
    - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
    - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    # --- Realm ---
    - KC_REALM_NAME=${KC_REALM_NAME}
    # --- URLs ---
    - KC_PORT=${KC_PORT}
    - KC_LOCAL_URL=${KC_LOCAL_URL}
    - KC_SERVER_URL=${KC_SERVER_URL}
    - SERVER_IP=${SERVER_IP}
    - HTTP_TYPE=${HTTP_TYPE}

    # --- DB (fallbacks si DB_KC_* non définis) ---
    - KC_DB_USERNAME=${DB_KC_USER:-keycloak}
    - KC_DB_PASSWORD=${DB_KC_PASSWORD:-keycloak}
    - KC_DB_URL_HOST=${DB_KC_CONTAINER_NAME:-keycloak}
    - KC_DB_URL_DATABASE=${DB_KC_DB:-keycloak-users}
    - KC_DB_URL_PORT=${DB_KC_PORT:-5432}
    # --- OIDC secrets (substitués par IMPORT_VARSUBSTITUTION) ---
    - OIDC_SECRET=${OIDC_SECRET}
  depends_on:
    - database-keycloak


# ============================================
# CONFIGURATION TRAEFIK
# ============================================
traefik:
  enabled: true
  prefix: /auth
  strip_prefix: true
  docker_port: 8180
  local_port: 8180
  health_path: /realms/master
  priority: 10


secrets:
  - name: KEYCLOAK_ADMIN
    description: "Nom d'utilisateur admin Keycloak"
    default: "admin"
  - name: KEYCLOAK_ADMIN_PASSWORD
    description: "Mot de passe admin Keycloak"
    default: "admin"
  - name: KC_REALM_NAME
    description: "Nom du realm par défaut"
    default: "usager"
  - name: KC_PORT
    description: "Port de Keycloak"
    default: "8180"
  - name: KC_VERSION
    description: "Version de Keycloak"
    default: "26.6.0"
  - name: KC_LOCAL_URL
    description: "URL interne pour les connexions container → container"
    default: "http://localhost:8180"
  - name: KC_SERVER_URL
    description: "URL publique de Keycloak pour les clients OIDC"
    default: "http://localhost:8080/auth"
  - name: OIDC_SECRET
    description: "Secret partagé pour le client backend OIDC"

metadata:
  category: auth
  tags:
    - auth

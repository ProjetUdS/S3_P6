# ============================================
# DATABASE (PostgreSQL)
# ============================================
db=postgres
db-username=${KC_DB_USERNAME}
db-password=${KC_DB_PASSWORD}
db-url-host=${KC_DB_URL_HOST}
db-url-database=${KC_DB_URL_DATABASE}
db-url-port=${KC_DB_URL_PORT}

# ============================================
# NETWORK / HTTP
# ============================================
http-enabled=true
http-port=${KC_PORT:-8180}

# ============================================
# HOSTNAME / PROXY (Traefik)
# ============================================
KC_HTTP_ENABLED=true
KC_PROXY_HEADERS=xforwarded
hostname=${KC_SERVER_URL}
hostname-path=/auth
hostname-admin-strict=false

# ============================================
# FEATURES
# ============================================
health-enabled=true


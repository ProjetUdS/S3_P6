# Généré automatiquement par manage-profiles.sh
# NE PAS ÉDITER MANUELLEMENT - Vos modifications seront écrasées
# Dernière génération : 2026-07-22 03:44:50
name: devlocal

services:
  # Reverse Proxy Traefik
  traefik:
    image: traefik:v3.6.4
    container_name: devlocal_traefik
    env_file:
      - ../.env
      - ../duckdns.env
    command:
      - "/bin/sh"
      - "-c"
      - "exec traefik --certificatesresolvers.duckdns.acme.dnschallenge=true --certificatesresolvers.duckdns.acme.dnschallenge.provider=duckdns --certificatesresolvers.duckdns.acme.email=$$ACME_EMAIL --certificatesresolvers.duckdns.acme.storage=/etc/traefik/certs/acme.json --certificatesresolvers.duckdns.acme.caServer=https://acme-v02.api.letsencrypt.org/directory --api=true --api.dashboard=true --api.insecure=true --entrypoints.web.address=:80 --entrypoints.websecure.address=:443 --providers.docker.exposedbydefault=false --providers.file.filename=/etc/traefik/dynamic.yml --providers.file.watch=true --log.level=DEBUG --accesslog=/etc/traefik/access.log"
    ports:
      - "80:80"
      - "8443:443"
      - "8081:8080"
    extra_hosts:
      - "external-ip:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/certs:/etc/traefik/certs:rw
    networks:
      - traefik-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Monitoring des logs
  dozzle:
    image: amir20/dozzle:latest
    container_name: devlocal_dozzle
    ports:
      - "9999:8080"
    environment:
      - DOZZLE_TIMEOUT=15s
      - DOZZLE_BASE=/logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "external-ip:host-gateway"
    networks:
      - traefik-network
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 3s
      timeout: 30s

  # Service: app
  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    pull_policy: never

    container_name: app
    environment:
      # Variables partagées (depuis config.yml)
      - LOG_LEVEL=info
      - NODE_ENV=development
      - TZ=America/Toronto
      # Variables exclusives du service
      - HTTP_TYPE=${HTTP_TYPE}
      - SERVER_IP=${SERVER_IP}
      - KC_PORT=${KC_PORT}
      - KEYCLOAK_PATH=${KEYCLOAK_PATH}
      - KC_REALM_NAME=${KC_REALM_NAME}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_SECRET=${OIDC_SECRET}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - MINIO_SERVER_URL=${MINIO_SERVER_URL}
    depends_on:
      - auth
    extra_hosts:
      - "external-ip:host-gateway"
    networks:
      - traefik-network

  # Service: auth
  auth:
    image: quay.io/keycloak/keycloak:${KC_VERSION:-26.6.0}

    container_name: auth
    environment:
      # Variables partagées (depuis config.yml)
      - LOG_LEVEL=info
      - NODE_ENV=development
      - TZ=America/Toronto
      # Variables exclusives du service
      - IMPORT_VARSUBSTITUTION_ENABLED=${IMPORT_VARSUBSTITUTION_ENABLED:-false}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_REALM_NAME=${KC_REALM_NAME}
      - KC_PORT=${KC_PORT}
      - KC_LOCAL_URL=${KC_LOCAL_URL}
      - KC_SERVER_URL=${KC_SERVER_URL}
      - SERVER_IP=${SERVER_IP}
      - HTTP_TYPE=${HTTP_TYPE}
      - KC_DB_USERNAME=${DB_KC_USER:-keycloak}
      - KC_DB_PASSWORD=${DB_KC_PASSWORD:-keycloak}
      - KC_DB_URL_HOST=${DB_KC_CONTAINER_NAME:-keycloak}
      - KC_DB_URL_DATABASE=${DB_KC_DB:-keycloak-users}
      - KC_DB_URL_PORT=${DB_KC_PORT:-5432}
      - OIDC_SECRET=${OIDC_SECRET}

    volumes:
      - ./keycloak/data:/var/tmp/configs:ro
      - ./keycloak/startup-scripts/init.sh:/init.sh
      - ./keycloak/keycloak.conf:/opt/keycloak/conf/keycloak.conf
      - ./keycloak/customized:/opt/keycloak/themes/customized
    entrypoint: sh -c "/init.sh"
    ports:
      - "${KC_PORT:-8180}:${KC_PORT:-8180}"
    depends_on:
      - database-keycloak
    extra_hosts:
      - "external-ip:host-gateway"
    networks:
      - traefik-network

  # Service: minio-storage
  minio-storage:
    image: minio/minio:${MINIO_VERSION:-latest}

    container_name: minio-storage
    environment:
      # Variables partagées (depuis config.yml)
      - LOG_LEVEL=info
      - NODE_ENV=development
      - TZ=America/Toronto
      # Variables exclusives du service
      - MINIO_ROOT_USER=${MINIO_USER:-local_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-local_password}

    ports:
      - "${MINIO_PORT:-9000}:${MINIO_PORT:-9000}"   # S3 API port
      - "9001:9001"   # Web UI console port
    volumes:
      - ../../volumes/minIo:/data
    command: server /data --console-address ":9001"
    extra_hosts:
      - "external-ip:host-gateway"
    networks:
      - traefik-network

  # Service: database
  database:
    image: postgres:13

    container_name: database
    environment:
      # Variables partagées (depuis config.yml)
      - LOG_LEVEL=info
      - NODE_ENV=development
      - TZ=America/Toronto
      # Variables exclusives du service
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DATABASE=${DB_NAME}

    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./postgres/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./postgres/02_setdata.sql:/docker-entrypoint-initdb.d/02_setdata.sql
      - ../../volumes/db:/var/lib/postgresql/data
    extra_hosts:
      - "external-ip:host-gateway"
    networks:
      - traefik-network

  # Service: database-keycloak
  database-keycloak:
    image: postgres:18

    # Option 3 : Décomposition complète (maximum de flexibilité)
    # image: ${EXAMPLE_REGISTRY:-docker.io}/${EXAMPLE_IMAGE:-nginx}:${EXAMPLE_TAG:-latest}

    container_name: database-keycloak
    environment:
      # Variables partagées (depuis config.yml)
      - LOG_LEVEL=info
      - NODE_ENV=development
      - TZ=America/Toronto
      # Variables exclusives du service
      - POSTGRES_USER=${DB_KC_USER}
      - POSTGRES_PASSWORD=${DB_KC_PASSWORD}
      - POSTGRES_DB=${DB_KC_DB}
    volumes:
      - ../../volumes/keycloak:/var/lib/postgresql
    extra_hosts:
      - "external-ip:host-gateway"
    networks:
      - traefik-network

  # Service: webserver
  webserver:
    build:
      context: ..
      dockerfile: docker/webserver/Dockerfile
    image: my-react-vite-app
    pull_policy: never

    container_name: webserver
    environment:
      # Variables partagées (depuis config.yml)
      - LOG_LEVEL=info
      - NODE_ENV=development
      - TZ=America/Toronto
      # Variables exclusives du service
      - PORT=81
      - KC_PORT=${KC_PORT}
      - KC_REALM_NAME=${KC_REALM_NAME}

    volumes:
      - ./webserver/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
    extra_hosts:
      - "external-ip:host-gateway"
    networks:
      - traefik-network


networks:
  traefik-network:
    driver: bridge

## Utilise une version locale de la db "app", pour que les
##  tests aient un environnement reproductible
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=${DB_USER}
%test.quarkus.datasource.password=${DB_PASSWORD}

##Utilise le port 8082 pour éviter les conflits avec docker
%test.quarkus.http.port=8082

quarkus:
    http:
        host: 0.0.0.0
        port: 8888
        # --- HTTP Authentication Rules ---
        auth:
            permission:
                # Règle 1 : Protéger uniquement les routes de l'API
                api:
                    paths: /api/*
                    policy: authenticated
                # Règle 2 : Laisser tout le reste public (index.html, Swagger, etc.)
                public:
                    paths:
                        - /*
                        - /q/swagger-ui/*
                        - /q/openapi
                    policy: permit
        # --- CORS Configuration ---
        cors:
            enabled: true
            exposed-headers:
                - location
                - info
            access-control-max-age: 24H
            origins:
                - http://localhost
                - http://localhost:8888
                - http://localhost:8180
            methods:
                - GET
                - PUT
                - POST
                - DELETE
                - OPTIONS
            headers:
                - Authorization
                - Content-Type
                - Accept
    # --- OIDC (OpenID Connect) Configuration ---
    oidc:
        auth-server-url: http://localhost:8180/realms/usager

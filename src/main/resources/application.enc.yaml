        credentials:
            secret: ENC[AES256_GCM,data:/daltYcxB21pgCWL9b+Wd01mfCSOTMA4cx4MujYF/j2VZ7e9,iv:JDop/i4L3CZWJnqaz/VmdpqMAONz9+9BJ2xmccrqbZI=,tag:Fe99xj/qEq50Hqa+9Z1rHw==,type:str]
        application-type: service
    # --- Data Source Configuration ---
